<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Socket.IO chat</title>
    <style>
        body {
            margin: 0;
            padding-bottom: 3rem;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #form {
            background: rgba(0, 0, 0, 0.15);
            padding: 0.25rem;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            height: 3rem;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
        }

        #input {
            border: none;
            padding: 0 1rem;
            flex-grow: 1;
            border-radius: 2rem;
            margin: 0.25rem;
        }

        #input:focus {
            outline: none;
        }

        #form>button {
            background: #333;
            border: none;
            padding: 0 1rem;
            margin: 0.25rem;
            border-radius: 3px;
            outline: none;
            color: #fff;
        }

        #messages {
            list-style-type: none;
            margin: 0;
            padding: 0;
        }

        #messages>li {
            padding: 0.5rem 1rem;
        }

        #messages>li:nth-child(odd) {
            background: #efefef;
        }

        #connectBtn {
            position: fixed;
            top: 0.5rem;
            right: 0.5rem;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 3px;
            background: #333;
            color: #fff;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div>
        <h3>Online Users:</h3>
        <ul id="onlineUsers"></ul>
    </div>
    <select id="userSelect">
        <option value="">Public</option>
    </select>

    <ul id="messages"></ul>
    <form id="nickNameFrom" action="">
        <input id="nickNameInput" placeholder="Enter Your Nick Name" autocomplete="off" /><button>Submit</button>
    </form>
    <form id="form" action="">
        <input id="input" autocomplete="off" /><button>Send</button>
        <br>
        <div id="typing"></div>
    </form>
    <button id="connectBtn">Disconnect</button>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        let counter = 0;
        const socket = io({
            auth: {
                serverOffset: 0
            },
            ackTimeout: 10000,
        });

        let connected = true;
        let nickname = "anonymous";
        let timeout;

        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const messages = document.getElementById('messages');
        const connectBtn = document.getElementById('connectBtn');
        const typing = document.getElementById('typing');
        const onlineUsers = document.getElementById('onlineUsers');
        const userSelect = document.getElementById('userSelect');

        socket.on('online users', (users) => {
            onlineUsers.innerHTML = '';
            userSelect.innerHTML = '<option value="">Public</option>';

            users.forEach(user => {
                const li = document.createElement('li');
                li.textContent = user;
                onlineUsers.appendChild(li);

                const option = document.createElement('option');
                option.value = user;
                option.textContent = user;
                userSelect.appendChild(option);
            });
        });


        input.addEventListener('input', (e) => {
            socket.emit('typing', nickname)

            clearTimeout(timeout)
            timeout = setTimeout(() => {
                socket.emit('stop typing', nickname)
            }, 1500)
        })
        // socket.on('online users', (users) => {
        //     onlineUsers.innerHTML = ''
        //     users.forEach(user => {
        //         const li = document.createElement('li')
        //         li.textContent = user;
        //         onlineUsers.appendChild(li)
        //     });
        // })

        socket.on('typing', (nickname) => {
            typing.textContent = `${nickname} is typing`;
        })
        socket.on('stop typing', (nickname) => {
            typing.textContent = '';
        })

        const nickNameFrom = document.getElementById('nickNameFrom');
        const nickNameInput = document.getElementById('nickNameInput');

        nickNameFrom.addEventListener('submit', (e) => {
            e.preventDefault();
            if (nickNameInput.value.trim()) {
                nickname = nickNameInput.value.trim();
                socket.emit("set nickname", nickname)
                // socket.auth.nickname = nickname;
                nickNameInput.value = '';
                nickNameFrom.style.display = 'none';
                alert(`your nick name is updated to ${nickname}`);
            }
        });


        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (!input.value.trim()) return;

            const message = input.value.trim();
            const selectedUser = userSelect.value;

            // 🔴 PRIVATE MESSAGE
            if (selectedUser) {
                socket.emit('private message', selectedUser, message, (res) => {
                    console.log(res);
                });

                // show locally
                const item = document.createElement('li');
                item.textContent = `To ${selectedUser} (private): ${message}`;
                item.style.color = "red";
                messages.appendChild(item);
            }
            // 🟢 PUBLIC MESSAGE
            else {
                const clientoffset = `${socket.id}-${counter++}`;

                const item = document.createElement('li');
                item.textContent = `${nickname}: ${message}`;
                messages.appendChild(item);

                socket.emit("chat message", message, clientoffset, nickname);
            }

            input.value = '';
        });

        // form.addEventListener('submit', (e) => {
        //     e.preventDefault();
        //     // const message = input.value.trim();
        //     // const selectedUser = userSelect.value;
        //     if (input.value) {
        //         const clientoffset = `${socket.id}-${counter++}`;
        //         const item = document.createElement('li');
        //         item.textContent = `${nickname}: ${input.value.trim()}`;
        //         messages.appendChild(item);
        //         window.scrollTo(0, document.body.scrollHeight);
        //         socket.emit("chat message", input.value, clientoffset, nickname, (response) => {
        //             console.log("Server Response", response)
        //         });
        //         input.value = '';
        //     }
        // });

        socket.on('chat message', (msg, serverOffset) => {
            const item = document.createElement('li');
            item.textContent = msg;
            messages.appendChild(item);
            window.scrollTo(0, document.body.scrollHeight);
            socket.auth.serverOffset = serverOffset;
        });
        socket.on('private message', (msg) => {
            const item = document.createElement('li');
            item.textContent = msg;
            item.style.color = "red";
            messages.appendChild(item);
        });

        connectBtn.addEventListener("click", () => {
            connected ? socket.disconnect() : socket.connect();
            connected = !connected;
            connectBtn.textContent = connected ? "Disconnect" : "Connect";

        })

    </script>
</body>

</html>
